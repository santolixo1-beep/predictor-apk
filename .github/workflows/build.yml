name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias del sistema
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev \
          ccache libtool-bin

    - name: Instalar pip, cython y buildozer
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install "cython<3.0" buildozer==1.5.0

    - name: Cache de Buildozer
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-${{ runner.os }}-

    - name: Pre-aceptar licencias Android SDK
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.android/android-sdk-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > ~/.android/android-sdk-preview-license
        echo -e "\nd975f751698a77b662f1254ddbeed3901e976f5a" > ~/.android/intel-android-extra-license

    - name: Compilar APK con Buildozer
      run: |
        export PIP_USER=false
        export PYTHONNOUSERSITE=1
        yes | buildozer -v android debug 2>&1 | tee build_log.txt
      continue-on-error: false

    - name: Mostrar las últimas 200 líneas del log si falla
      if: failure()
      run: |
        echo "===== ÚLTIMAS 200 LÍNEAS DEL LOG ====="
        tail -n 200 build_log.txt

    - name: Subir APK como artefacto
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: predictor-apk
        path: bin/*.apk
        retention-days: 30
